name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Matrix
        run: |
          mkdir -p dist
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          targets=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/arm64"
            "linux/amd64"
            "windows/arm64"
            "windows/amd64"
          )
          
          for target in "${targets[@]}"; do
            os="${target%%/*}"
            arch="${target##*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            output="dist/claudehub-${VERSION}-${os}-${arch}${ext}"
            echo "Building $output..."
            GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o "$output" ./cmd/claudehub
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
