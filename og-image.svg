<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" rx="0" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="6" fill="#ff6b2c"/>
  <circle cx="72" cy="72" r="14" fill="#ff6b2c"/>
  <text x="98" y="82" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#e6edf3">ClaudeSwap</text>
  <text x="72" y="200" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#e6edf3">Switch Claude Code accounts</text>
  <text x="72" y="270" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#e6edf3">in seconds.</text>
  <text x="72" y="350" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#9aa5b1">Track quotas &#183; supervise parallel sessions &#183; keep context across profiles</text>
  <text x="72" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#58a6ff">$ claudeswap handoff personal</text>
  <text x="72" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#3fb950">Resumed with full context in under 2s</text>
  <rect x="72" y="520" width="360" height="56" rx="12" fill="#ff6b2c"/>
  <text x="100" y="557" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Install ClaudeSwap</text>
  <text x="840" y="600" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9aa5b1">Free &#183; Open Source &#183; MIT</text>
</svg>
